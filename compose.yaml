# Local development database. Credentials are local-only defaults; override via .env if needed.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: settlebook
      POSTGRES_USER: ${DB_USERNAME:-settlebook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-settlebook}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d settlebook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
